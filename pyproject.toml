[project]
name = "crispy3"
version = "3.0.0"
description = "A monorepo containing all of the CRISPy-web packages"
authors = [{ name = "Kai Blin", email = "kblin@dtu.dk" }]
dependencies = ["setuptools>=80.9.0", "build>=1.2.2.post1", "biopython>=1.85", "valkey>=6.1.0", "requests>=2.32.4", "feedparser>=6.0.11", "flask>=3.1.1", "gunicorn>=23.0.0", "flask-cors>=6.0.1"]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

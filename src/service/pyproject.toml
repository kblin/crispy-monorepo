[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crispy-service"
dynamic = ["version"]
authors = [{ name = "Kai Blin", email = "packaging@secondarymetabolites.org" }]
description = "Job runners for CRISPy web service"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE.txt" }
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]
dependencies = [
    "biopython >= 1.80",
    "crispy-models",
    "nearmiss >= 0.1.3",
    "valkey",
    "requests",
]

[project.optional-dependencies]
testing = ["pytest", "pytest-cov"]

[project.urls]
"Homepage" = "https://github.com/secondarymetabolites/crispy-service/"

[project.scripts]
crispy-prepare = "crispy_service.prepare:main"
crispy-scan = "crispy_service.scan:main"
crispy-standalone = "crispy_service.standalone:main"
crispy-cleanup = "crispy_service.cleanup:main"

[tool.setuptools]
packages = ["crispy_service"]

[tool.setuptools.dynamic]
version = { attr = "crispy_service.version.__version__" }

[tool.flake8]
max-line-length = 120
